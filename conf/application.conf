# https://www.playframework.com/documentation/latest/Configuration
play.http.errorHandler = "controllers.SheetExceptionHandler"
play.filters.enabled += play.filters.cors.CORSFilter

play.filters.disabled += play.filters.csrf.CSRFFilter

play.http.secret.key=${?APPLICATION_SECRET}
play.filters.hosts {
  # Allow requests to example.com, its subdomains, and localhost:9000.
  allowed = ["152.228.135.213", "localhost", "zoltraak.ovh", "sheet-manager-dev:9000", "sheet-manager:9000"]
}

services.oauth.route = ${?OAUTH_ROUTE}
services.oauth.jwt.cookie.name = ${?JWT_COOKIE_NAME}
